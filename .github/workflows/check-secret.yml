name: check-secret

# Run this after setting CLAUDE_CODE_OAUTH_TOKEN. It reports only whether the
# secret is set and looks like a Claude OAuth token, never its value.
on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check CLAUDE_CODE_OAUTH_TOKEN
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [[ -z $CLAUDE_CODE_OAUTH_TOKEN ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty. Set it from a real terminal or the web UI, not through a non-interactive shell."
            exit 1
          fi
          if [[ $CLAUDE_CODE_OAUTH_TOKEN != sk-ant-oat* ]]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is set but does not look like a token from 'claude setup-token'."
            exit 1
          fi
          echo "CLAUDE_CODE_OAUTH_TOKEN is set (${#CLAUDE_CODE_OAUTH_TOKEN} characters)."
